name: Windows desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Set package version from the release tag
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          npm version $version --no-git-tag-version --allow-same-version
      - run: npm run desktop:build:assets
        env:
          DESKTOP_RELEASE_OWNER: ${{ vars.DESKTOP_RELEASE_OWNER || 'Lithesys' }}
          DESKTOP_RELEASE_REPO: ${{ vars.DESKTOP_RELEASE_REPO || 'simple-erp' }}
      - name: Build the installer and update metadata
        run: npx electron-builder --config electron-builder.config.cjs --win nsis --publish never
        env:
          DESKTOP_RELEASE_OWNER: ${{ vars.DESKTOP_RELEASE_OWNER || 'Lithesys' }}
          DESKTOP_RELEASE_REPO: ${{ vars.DESKTOP_RELEASE_REPO || 'simple-erp' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Match installer names to update metadata
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $installer = Get-ChildItem release -File -Filter '*.exe' | Select-Object -First 1
          $blockmap = Get-ChildItem release -File -Filter '*.exe.blockmap' | Select-Object -First 1
          if (-not $installer -or -not $blockmap) { throw 'The installer or its blockmap was not produced.' }
          $installerName = "ERP-Setup-$version.exe"
          $blockmapName = "$installerName.blockmap"
          if ($installer.Name -ne $installerName) {
            Move-Item -LiteralPath $installer.FullName -Destination (Join-Path $installer.DirectoryName $installerName)
          }
          if ($blockmap.Name -ne $blockmapName) {
            Move-Item -LiteralPath $blockmap.FullName -Destination (Join-Path $blockmap.DirectoryName $blockmapName)
          }
      - name: Publish one release with all installer assets
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.DESKTOP_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}
          repository: ${{ vars.DESKTOP_RELEASE_OWNER || 'Lithesys' }}/${{ vars.DESKTOP_RELEASE_REPO || 'simple-erp' }}
          name: ERP ${{ github.ref_name }}
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          fail_on_unmatched_files: true
